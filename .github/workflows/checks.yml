name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.13
      - name: Test persistence and selective sharing
        run: uv run --frozen pytest
      - name: Lint
        run: uv run --frozen ruff check toolbox tests
      - name: Type check
        run: uv run --frozen basedpyright

  windows-package:
    name: Windows portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
      - name: Build portable archive
        run: ./scripts/build-windows.ps1
      - name: Test extracted package without Python on PATH
        run: ./scripts/test-windows-package.ps1 -Archive (Get-ChildItem dist/*.zip).FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
