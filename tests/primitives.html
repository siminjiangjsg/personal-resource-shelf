<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组件检查</title><link rel="stylesheet" href="../web/styles.css"></head><body>
<main class="stack"><h1>组件检查</h1><div class="cluster"><button class="btn primary">保存资源</button><button class="btn">取消</button><button class="btn" disabled>正在保存</button><a href="https://example.com">原始链接</a></div>
<label class="field">资源名称<input class="input" value="本地资料整理工具"></label>
<label class="field">分类<select class="input"><option>科研</option></select></label>
<label class="check"><input type="checkbox" checked>已选择，加入分享清单</label>
<p class="error" role="alert">请输入完整的网页链接。</p><div class="note">私人笔记保留在本机。</div>
<article class="resource"><label class="select-hit"><input type="checkbox" checked aria-label="选择资源"></label><div><button class="resource-title">科研资料整理工具</button><p class="resource-description">整理文献与项目资料。</p><a class="resource-url" href="https://example.com">https://example.com</a></div></article>
<div class="empty"><h2>还没有收藏</h2><p>粘贴第一个链接，开始整理。</p></div></main></body></html>
