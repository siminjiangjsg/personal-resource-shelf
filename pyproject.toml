[project]
name = "personal-resource-shelf"
version = "1.0.0"
description = "Local personal resource library with selective offline sharing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.52.1"]

[project.urls]
Repository = "https://github.com/siminjiangjsg/personal-resource-shelf"
Issues = "https://github.com/siminjiangjsg/personal-resource-shelf/issues"

[dependency-groups]
dev = ["pytest>=9,<10", "httpx2", "ruff>=0.14", "basedpyright>=1.31", "playwright==1.62.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["toolbox"]
reportUnusedCallResult = false
# SQL and HTML are deliberately split over adjacent literal lines.
reportImplicitStringConcatenation = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "EM101", "D203", "D213", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "FBT001", "FBT002", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]

[tool.toolbox]
storage = "stdlib sqlite3; synchronous short transactions, no ORM or background workers"
ui = "buildless native browser modules"
outbound-network = false
